name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guard - dist/ must not be tracked in git
        run: |
          if [ -n "$(git ls-files dist/)" ]; then
            echo "ERROR: compiled dist/ files are tracked in git. dist/ is a build artifact and must stay untracked (see .gitignore). Run: git rm -r --cached dist/"
            git ls-files dist/
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Run tests
        run: node test.mjs
